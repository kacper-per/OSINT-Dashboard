<div class="row g-3 summary-grid mt-1">
  <div class="col-6 col-lg">
    <div class="summary-card"><span>Subdomains</span><strong>{{ summary.subdomains }}</strong></div>
  </div>
  <div class="col-6 col-lg">
    <div class="summary-card"><span>DNS records</span><strong>{{ summary.dns_records }}</strong></div>
  </div>
  <div class="col-6 col-lg">
    <div class="summary-card"><span>HTTP results</span><strong>{{ summary.http_results }}</strong></div>
  </div>
  <div class="col-6 col-lg">
    <div class="summary-card"><span>Emails</span><strong>{{ summary.emails }}</strong></div>
  </div>
  <div class="col-12 col-lg">
    <div class="summary-card warning-card"><span>Missing headers</span><strong>{{ summary.missing_headers }}</strong></div>
  </div>
</div>
